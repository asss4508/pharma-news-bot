name: 90분 주요 뉴스
on:
  schedule:
    # KST 09:00, 10:30, 12:00, 13:30, 15:00, 16:30, 18:00, 19:30, 21:00
    # UTC 기준. GitHub 실행 대기열에 따라 실제 발송은 지연될 수 있다.
    - cron: "0 0,3,6,9,12 * * *"
    - cron: "30 1,4,7,10 * * *"
  workflow_dispatch:
concurrency:
  group: hourly-news
  cancel-in-progress: false
jobs:
  send-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install requests beautifulsoup4
      - name: 주요 뉴스 전송
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: python pharma-news/scripts/send_hourly_news.py
      - name: 전송 이력 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/hourly_sent_log.json
          git diff --cached --quiet || git commit -m "chore: 시간별 뉴스 전송 이력 업데이트"
          git push
